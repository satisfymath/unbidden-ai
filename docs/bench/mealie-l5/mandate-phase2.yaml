    - [docker, compose, -p, mealie-sqlite, -f, docker/docker-compose.yml, -f, /Users/david/unbidden-l5/mealie-sqlite.override.yml, up, -d, --build, --wait, mealie]
    probe_every_s: 5
    probe_auth:
      username_env: UNBIDDEN_PROBE_USERNAME
      password_env: UNBIDDEN_PROBE_PASSWORD
    guard_samples: 15
