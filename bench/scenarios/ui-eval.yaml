# Multimodal UI evaluation, fixed on 2026-10-27 before any run. Task: is the product page healthy, and if not,
# which part is wrong? Two judges see the same captures: `browser` (no model: console errors, failed requests,
# images not loaded, against the reference) and `visual` (the reference and current screenshots, Muse Spark 1.3).
# The multimodal judge is integrated only if it beats the browser judge on both detection and attribution.
page: http://127.0.0.1:8080/product/OLJCESPC7Z
capture_wait_ms: 3000
settle_s: 20  # after a flag changes, before capturing
repetitions: 3
conditions:
  - {name: healthy, flag: null, degraded: false}
  - {name: ad, flag: adFailure, variant: "on", degraded: true, part: "\\bads?\\b|advert|banner|promot"}
  - {name: images, flag: imageSlowLoad, variant: 10sec, degraded: true, part: "image|picture|photo|thumbnail"}
  - {name: product, flag: productCatalogFailure, variant: "targeting:on", degraded: true, part: "product|error|not found|detail"}
scoring:
  detection: the judge's degraded equals the condition's degraded
  attribution: for degraded conditions, the judge's `what` matches the part's regex (case-insensitive)
