faults:
  - {flag: paymentUnreachable, variant: "on", expect: payment}
  - {flag: recommendationCacheFailure, variant: "on", expect: recommendation}
  - {flag: imageSlowLoad, variant: 5sec, expect: image-provider}
pass: the expected service degraded within 5 minutes; services reported that the fault cannot reach are false alarms
