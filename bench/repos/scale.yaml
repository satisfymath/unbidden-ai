# Scale benchmark: full autonomous cycles on repositories Unbidden has never seen.
#
# Pre-registered on 2026-10-27, before any run of this set. Commits pinned to each default branch's HEAD that day.
#
# Inclusion, all required:
#   - public on GitHub, an OSI license, not archived, not a fork;
#   - pushed to within the last 12 months (on 2026-10-27);
#   - has a test suite;
#   - never used while developing Unbidden: excludes full-stack-fastapi-template, rich, mealie, opentelemetry-demo,
#     the 12 Level A repositories (bench/repos/level-a.yaml) and the earlier prototype's set (honojs/hono, simonw/llm,
#     meta-llama/*, ogx-ai/*, apache/burr, apache/hamilton, fastapi/typer, pydantic/logfire, facebook/lexical,
#     guardrails-ai/guardrails, kaiko-ai/eva).
# Exclusion: clones over 500 MB; repositories needing secrets, a GPU or a paid service to run their tests.
# Stratified by language and shape (library, web framework, application with a database), including languages
#   Unbidden cannot analyze yet (Go, Ruby, Rust): they are in the denominator, not left out.
# Applied, not only stated: pallets/itsdangerous was a candidate and is out (last push 2025-06-14); jpadilla/pyjwt
#   replaced it in the same stratum. encode/starlette is listed at its current home, Kludex/starlette.
#
# `pilot` validates the method and may lead to fixes in Unbidden. `holdout` is run once, after those fixes, and
# nothing in Unbidden is changed because of what it shows.
repos:
  # pilot ------------------------------------------------------------------------------------------------------------
  - {name: pyjwt, url: https://github.com/jpadilla/pyjwt, commit: 16231abfd1d8eab4953e8779b3017b859c88565e, split: pilot, license: MIT, language: Python, shape: library, database: none, domain: security tokens}
