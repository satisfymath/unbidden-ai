# The landing and the installer at https://unbidden.cl: site/ plus install.sh, uploaded to Cloudflare Pages
# (project "unbidden") on every push to main that touches them. The wheel itself is never here: install.sh
# downloads it from the GitHub release and verifies it. Secrets: CLOUDFLARE_API_TOKEN (scoped to this zone and
# Pages), CLOUDFLARE_ACCOUNT_ID.
name: Site

on:
  push:
    branches: [main]
    paths: [site/**, install.sh, Makefile, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make site-build
      - name: Publish to Cloudflare Pages
        run: npx -y wrangler@4 pages deploy dist/site --project-name unbidden --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
